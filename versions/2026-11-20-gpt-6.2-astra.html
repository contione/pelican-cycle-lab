<script>
'use strict';
const VERSION_ID = '2026-11-20-gpt-6.2-astra';
const elements = Object.fromEntries([...document.querySelectorAll('[id]')].map(element => [element.id, element]));
const motion = matchMedia('(prefers-reduced-motion: reduce)');
let running = !motion.matches, elapsed = 0, previous = null, pending = null, speed = 1;
function transform(name, value) { elements[name].setAttribute('transform', value); }
function poseLeg(side, phase, bounce) {
  const pedalX = 545 + 20 * Math.cos(phase), pedalY = 325 + 20 * Math.sin(phase);
  const hipX = side === 'near' ? 512 : 505, hipY = 230 + bounce;
  const horizontal = pedalX - hipX, vertical = pedalY - 6 - hipY, span = Math.hypot(horizontal, vertical);
  const bend = Math.sqrt(Math.max(0, 64 ** 2 - (span / 2) ** 2)) / span;
  const kneeX = hipX + horizontal / 2 + vertical * bend, kneeY = hipY + vertical / 2 - horizontal * bend;
  elements[side + 'Leg'].setAttribute('d', 'M' + hipX + ' ' + hipY + ' L' + kneeX + ' ' + kneeY + ' L' + pedalX + ' ' + (pedalY - 6));
  transform(side + 'Foot', 'translate(' + pedalX + ' ' + pedalY + ')');
}
function draw(seconds) {
  const phase = seconds * 3.2, degrees = phase * 180 / Math.PI, bounce = Math.sin(2 * phase) * 1.5;
  transform('rider', 'translate(0 ' + bounce + ')');
  transform('ribbon', 'rotate(' + (3 * Math.sin(phase * 2)) + ' 538 153)');
  transform('arm', 'translate(545 325) rotate(' + degrees + ')');
  for (const wheel of ['front','rear']) transform(wheel, 'rotate(' + degrees * .78 + ')');
  poseLeg('far', phase + Math.PI, bounce); poseLeg('near', phase, bounce);
  elements.pavers.setAttribute('patternTransform','translate(' + (-(seconds * 3.2 * .78 * 61.5) % 132) + ' 0)');
  elements.ripples.setAttribute('patternTransform','translate(' + (-seconds * 9 % 188) + ' 0)');
  transform('weeds', 'translate(' + (-seconds * 170 % 430) + ' 0)');
  transform('lamp-beam', 'rotate(' + (6 * Math.sin(seconds * .52)) + ' 914 145)');
}
function frame(now) {
  if (previous !== null) elapsed += Math.min((now - previous) / 1000, .1) * speed;
  previous = now; draw(elapsed); pending = requestAnimationFrame(frame);
}
function sync() {
  cancelAnimationFrame(pending); previous = null;
  elements.play.textContent = running ? 'Ⅱ 暂停骑行' : '▶ 继续骑行';
  if (running && !document.hidden) pending = requestAnimationFrame(frame);
}
elements.play.onclick = () => { running = !running; sync(); };
elements.restart.onclick = () => { elapsed = 0; previous = null; draw(0); };
elements.speed.oninput = () => { speed = Number(elements.speed.value); elements.rate.value = speed + '×'; };
motion.addEventListener('change', event => { running = !event.matches; sync(); });
document.addEventListener('visibilitychange', sync);
draw(0); sync();
const base = new URL(location.pathname.includes('/versions/') ? '../' : './', location.href);
elements.edition.onchange = () => location.assign(new URL(elements.edition.value, base));
if (location.protocol !== 'file:') fetch(new URL('versions.json', base)).then(response => response.json()).then(versions => {
  elements.edition.replaceChildren(...versions.map(version => new Option(version.date + ' · ' + version.model, version.path, false, version.id === VERSION_ID)));
}).catch(() => {});
</script></body></html>
